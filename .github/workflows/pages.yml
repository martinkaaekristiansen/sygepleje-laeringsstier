name: Udgiv Læringsstier på GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    # Playwright 1.56.1 understøtter Ubuntu 24.04; undgå skift via ubuntu-latest.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: read
    steps:
      - name: Hent projektet
        uses: actions/checkout@v4
      - name: Klargør Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Appen er uden runtime-afhængigheder. Playwright installeres kun til test.
      - name: Test
        run: npm test
      - name: Byg statisk app
        run: npm run build
      - name: Klargør browsertest
        timeout-minutes: 15
        run: |
          set -euo pipefail
          npm ci --ignore-scripts 2>&1 | tee /tmp/pages-browser-setup.log
          npx playwright install --with-deps chromium 2>&1 | tee -a /tmp/pages-browser-setup.log
      - name: Test browser og Pages-undermappe
        run: |
          set -euo pipefail
          mkdir -p /tmp/pages-test
          ln -s "$GITHUB_WORKSPACE/dist" /tmp/pages-test/sygepleje-laeringsstier
          python3 -m http.server 3001 --bind 127.0.0.1 --directory /tmp/pages-test > /tmp/pages-test.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          for attempt in 1 2 3 4 5; do
            if curl --silent --fail http://127.0.0.1:3001/sygepleje-laeringsstier/ > /dev/null; then break; fi
            sleep 1
          done
          curl --silent --fail http://127.0.0.1:3001/sygepleje-laeringsstier/ > /dev/null
          npm run test:browser 2>&1 | tee /tmp/pages-browser-test.log
      - name: Gem browserdiagnostik
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browserdiagnostik
          path: |
            /tmp/pages-browser-*.log
            /tmp/pages-test.log
            /tmp/blood-*.png
          retention-days: 7
      - name: Vis browserfejl i joboversigten
        if: failure()
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          for name in ['setup', 'test']:
              log = Path('/tmp/pages-browser-' + name + '.log')
              if log.exists():
                  lines = log.read_text().splitlines()[-100:]
                  with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
                      summary.write('### Browserkontrol: ' + name + '\n\n```text\n' + '\n'.join(lines) + '\n```\n')
          PY
      - name: Klargør GitHub Pages
        uses: actions/configure-pages@v5
      - name: Gem websted til udgivelse
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Udgiv
        id: deployment
        uses: actions/deploy-pages@v4
