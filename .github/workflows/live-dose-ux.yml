name: Kontrollér offentlig Dødelig dosis UX én gang
on:
  push:
    branches: [qa-doedelig-dosis-ux-20261126]
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --ipc=host
    env:
      APP_URL: https://martinkaaekristiansen.github.io/sygepleje-laeringsstier/
      EXPECTED_ASSET_HASH: a7be319f5e1a
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: e607953b9b3d3073c8a9dadc5a48340b21055870
          persist-credentials: false
          sparse-checkout: |
            public
            test
            tests-browser
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - name: Kræv den nye offentliggjorte assetversion
        run: |
          node --input-type=module <<'JS'
          import {readFileSync,writeFileSync} from 'node:fs';
          const p='tests-browser/smoke-games.cjs',s=readFileSync(p,'utf8'),needle='assert.match(script,';
          if(s.split(needle).length!==2)throw Error('Unexpected smoke-test source');
          writeFileSync(p,s.replace(needle,"assert.equal(script, './assets/' + process.env.EXPECTED_ASSET_HASH + '/app.js');\n        "+needle));
          JS
      - name: Offentlig platform, quiz, migration og backup
        run: |
          node tests-browser/acceptance.cjs
          node tests-browser/quality-fixes.cjs
      - name: Alle tre eksisterende spil på desktop og mobil
        run: node tests-browser/smoke-games.cjs
      - name: Dødelig dosis, fire komplette offentlige gennemspilninger
        run: |
          node tests-browser/dose-investigation.cjs
          node tests-browser/dose-ux.cjs
      - name: Bevar måleresultater
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: live-doedelig-dosis-resultater
          path: |
            artifacts/dose/browser-results.json
            artifacts/dose-ux/ux-results.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Diagnostik ved fejl
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: live-doedelig-dosis-diagnostik
          path: |
            /tmp/*.png
            artifacts/dose/*.png
          retention-days: 7
